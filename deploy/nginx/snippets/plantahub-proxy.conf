# /etc/nginx/snippets/plantahub-proxy.conf
# Proxy para o Spring Boot em loopback (server.port=8080, SERVER_ADDRESS=127.0.0.1).
# application-prod.yml usa server.forward-headers-strategy=framework: os X-Forwarded-*
# abaixo são o que faz o Spring enxergar https e o host público.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_connect_timeout 10s;
# proxy_read_timeout/proxy_send_timeout ficam em cada location (repetir no mesmo bloco é erro).
