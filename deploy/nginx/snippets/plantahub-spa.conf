# /etc/nginx/snippets/plantahub-spa.conf
# Frontend React/Vite. Estrutura real do build (vite build → dist/):
#   index.html, assets/*.js|*.css (com hash), brand/, photos/, products/, vite.svg
#
# Regra central: arquivo estático inexistente responde 404, NUNCA index.html. Foi o
# fallback indiscriminado que produziu "Expected a JavaScript module script but the
# server responded with a MIME type of text/html".

root /var/www/plantahub/frontend;
index index.html;

# Arquivos com hash no nome: imutáveis.
# ^~ impede que a regex de extensões abaixo capture /assets/*.js antes deste bloco.
location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include snippets/plantahub-security-headers.conf;
}

# Pastas de public/ copiadas para dist/ sem hash.
location ^~ /brand/ {
    try_files $uri =404;
    expires 7d;
}
location ^~ /photos/ {
    try_files $uri =404;
    expires 7d;
}
location ^~ /products/ {
    try_files $uri =404;
    expires 7d;
}

# Qualquer outro arquivo estático pedido pela extensão também não cai no index.html.
location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|txt|xml|webmanifest)$ {
    try_files $uri =404;
}

# Arquivos ocultos nunca são servidos.
location ~ /\. {
    return 404;
}

# index.html nunca em cache: é ele que aponta para os assets da versão atual.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include snippets/plantahub-security-headers.conf;
}

# Rotas da SPA (react-router: /produtos, /casas/confort, /admin/..., etc.).
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include snippets/plantahub-security-headers.conf;
}
