# /etc/nginx/snippets/plantahub-ssl.conf
# Parâmetros TLS comuns. Não depende de /etc/letsencrypt/options-ssl-nginx.conf, que só
# existe quando o plugin nginx do certbot edita a configuração (aqui usamos --webroot).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:plantahub_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
