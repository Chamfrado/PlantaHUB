# /etc/nginx/snippets/plantahub-acme.conf
# Desafio HTTP-01 do Let's Encrypt (certbot certonly --webroot). Precisa responder em
# HTTP puro, antes de qualquer redirecionamento.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
