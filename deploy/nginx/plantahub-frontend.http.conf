# /etc/nginx/sites-available/plantahub-frontend   (versão PROVISÓRIA, só HTTP)
#
# Instalada por deploy/scripts/06-setup-nginx.sh enquanto o certificado não existe.
# Serve o desafio ACME e o próprio site em HTTP, para testar antes do SSL.
# 07-setup-ssl.sh frontend a substitui por plantahub-frontend.conf.

server {
    listen 80;
    listen [::]:80;
    server_name plantahub.com.br;

    include snippets/plantahub-acme.conf;

    location / {
        return 301 http://www.plantahub.com.br$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.plantahub.com.br;

    access_log /var/log/nginx/plantahub-frontend.access.log;
    error_log  /var/log/nginx/plantahub-frontend.error.log;

    include snippets/plantahub-acme.conf;
    include snippets/plantahub-spa.conf;
}
