# /etc/nginx/conf.d/plantahub-global.conf  (incluído dentro do bloco http do nginx.conf)
server_tokens off;

# O nginx.conf do Ubuntu liga gzip mas deixa gzip_types comentado (só text/html).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;
