# /etc/nginx/sites-available/plantahub-api   (versão DEFINITIVA, com SSL)
#
# Instalada por deploy/scripts/07-setup-ssl.sh api, depois que o certificado
# /etc/letsencrypt/live/api.plantahub.com.br/ existe.

server {
    listen 80;
    listen [::]:80;
    server_name api.plantahub.com.br;

    include snippets/plantahub-acme.conf;

    location / {
        return 301 https://api.plantahub.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plantahub.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.plantahub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.plantahub.com.br/privkey.pem;
    include snippets/plantahub-ssl.conf;

    access_log /var/log/nginx/plantahub-api.access.log;
    error_log  /var/log/nginx/plantahub-api.error.log;

    include snippets/plantahub-security-headers.conf;

    # Arquivos grandes (BIM/DWG) vão do navegador direto para a S3 por URL assinada;
    # pela API passam só JSON. 10 MB cobre com folga o maior payload JSON.
    client_max_body_size 10m;

    # Gera o ZIP de forma síncrona: baixa os arquivos da S3, compacta em /tmp e envia de
    # volta ao bucket (DownloadBundleService). Pacotes grandes levam minutos.
    location = /v1/me/downloads/bundle {
        include snippets/plantahub-proxy.conf;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        include snippets/plantahub-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
