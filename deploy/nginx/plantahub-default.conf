# /etc/nginx/sites-available/plantahub-default
# Substitui o site "default" do Ubuntu: qualquer Host que não seja um dos domínios do
# PlantaHUB (ex.: acesso direto pelo IP, scanners) recebe conexão fechada.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
