# /etc/nginx/sites-available/plantahub-api   (versão PROVISÓRIA, só HTTP)
#
# Instalada por deploy/scripts/06-setup-nginx.sh enquanto o certificado não existe.
# 07-setup-ssl.sh api a substitui por plantahub-api.conf.
#
# Atenção: com AUTH_COOKIE_SECURE=true o login não funciona em HTTP puro (o navegador
# descarta cookie "Secure"). Esta fase serve só para testar /health e o ACME.

server {
    listen 80;
    listen [::]:80;
    server_name api.plantahub.com.br;

    access_log /var/log/nginx/plantahub-api.access.log;
    error_log  /var/log/nginx/plantahub-api.error.log;

    include snippets/plantahub-acme.conf;

    client_max_body_size 10m;

    location = /v1/me/downloads/bundle {
        include snippets/plantahub-proxy.conf;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        include snippets/plantahub-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
