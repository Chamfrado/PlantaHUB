# /etc/nginx/sites-available/plantahub-frontend   (versão DEFINITIVA, com SSL)
#
# Instalada por deploy/scripts/07-setup-ssl.sh frontend, depois que o certificado
# /etc/letsencrypt/live/plantahub.com.br/ (SAN: plantahub.com.br + www) existe.
#
#   http://plantahub.com.br/*       → 301 https://www.plantahub.com.br/*
#   http://www.plantahub.com.br/*   → 301 https://www.plantahub.com.br/*
#   https://plantahub.com.br/*      → 301 https://www.plantahub.com.br/*
#   https://www.plantahub.com.br/*  → SPA

server {
    listen 80;
    listen [::]:80;
    server_name plantahub.com.br www.plantahub.com.br;

    include snippets/plantahub-acme.conf;

    location / {
        return 301 https://www.plantahub.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plantahub.com.br;

    ssl_certificate     /etc/letsencrypt/live/plantahub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plantahub.com.br/privkey.pem;
    include snippets/plantahub-ssl.conf;

    return 301 https://www.plantahub.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plantahub.com.br;

    ssl_certificate     /etc/letsencrypt/live/plantahub.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plantahub.com.br/privkey.pem;
    include snippets/plantahub-ssl.conf;

    access_log /var/log/nginx/plantahub-frontend.access.log;
    error_log  /var/log/nginx/plantahub-frontend.error.log;

    include snippets/plantahub-security-headers.conf;
    include snippets/plantahub-spa.conf;
}
