name: Deploy PlantaHUB Production

on:
  push:
    branches:
      - prod

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to Production VM
    runs-on: ubuntu-latest

    env:
      BACKEND_DIR: apps/api/plantahub-api
      FRONTEND_DIR: apps/web/plantahub-web

      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_PORT: ${{ secrets.VM_PORT }}

      BACKEND_REMOTE_PATH: /opt/plantahub/backend/app.jar
      FRONTEND_REMOTE_PATH: /var/www/plantahub/frontend

      VITE_API_URL: https://api.plantahub.com.br

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Backend - Java Spring Boot
      # =========================

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        shell: bash
        run: |
          set -e

          echo "Building backend from: $BACKEND_DIR"

          if [ -f "$BACKEND_DIR/mvnw" ]; then
            chmod +x "$BACKEND_DIR/mvnw"
            cd "$BACKEND_DIR"
            ./mvnw -B clean package -DskipTests
          else
            cd "$BACKEND_DIR"
            mvn -B clean package -DskipTests
          fi

      - name: Prepare backend artifact
        shell: bash
        run: |
          set -e

          mkdir -p deploy/backend

          JAR_FILE=$(find "$BACKEND_DIR/target" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "original-*.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No .jar file found in $BACKEND_DIR/target"
            exit 1
          fi

          echo "Found jar: $JAR_FILE"
          cp "$JAR_FILE" deploy/backend/app.jar

      # =========================
      # Frontend - React + Vite
      # =========================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/plantahub-web/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -e

          echo "Building frontend from: $FRONTEND_DIR"

          cd "$FRONTEND_DIR"

          echo "VITE_API_URL=$VITE_API_URL" > .env.production

          npm ci
          npm run build

          if [ ! -d "dist" ]; then
            echo "Frontend dist folder was not generated"
            exit 1
          fi

      # =========================
      # SSH setup
      # =========================

      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/plantahub_deploy_key
          chmod 600 ~/.ssh/plantahub_deploy_key

          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts

      # =========================
      # Deploy backend
      # =========================

      - name: Upload backend jar
        shell: bash
        run: |
          set -e

          echo "Uploading backend app.jar to VM..."

          rsync -avz \
            -e "ssh -i ~/.ssh/plantahub_deploy_key -p $VM_PORT -o StrictHostKeyChecking=yes" \
            deploy/backend/app.jar \
            "$VM_USER@$VM_HOST:/tmp/plantahub-app.jar"

      - name: Install backend jar and restart service
        shell: bash
        run: |
          set -e

          echo "Installing backend jar and restarting service..."

          ssh -i ~/.ssh/plantahub_deploy_key \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -e
             mkdir -p /opt/plantahub/backend
             mv /tmp/plantahub-app.jar $BACKEND_REMOTE_PATH
             chmod 644 $BACKEND_REMOTE_PATH
             systemctl restart plantahub-backend
             systemctl status plantahub-backend --no-pager"

      # =========================
      # Deploy frontend
      # =========================

      - name: Upload frontend dist with rsync
        shell: bash
        run: |
          set -e

          echo "Uploading frontend dist to VM..."

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/plantahub_deploy_key -p $VM_PORT -o StrictHostKeyChecking=yes" \
            "$FRONTEND_DIR/dist/" \
            "$VM_USER@$VM_HOST:$FRONTEND_REMOTE_PATH/"

      - name: Fix frontend permissions and reload nginx
        shell: bash
        run: |
          set -e

          echo "Fixing permissions and reloading nginx..."

          ssh -i ~/.ssh/plantahub_deploy_key \
            -p "$VM_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "set -e
             chmod -R 755 $FRONTEND_REMOTE_PATH
             find $FRONTEND_REMOTE_PATH -type f -exec chmod 644 {} \;
             nginx -t
             systemctl reload nginx"

      - name: Deploy finished
        run: echo "PlantaHUB production deploy finished successfully."
