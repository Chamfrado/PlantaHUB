server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

security:
  jwt:
    issuer: plantahub
    secret: ${JWT_SECRET}
    access-token-minutes: 240

app:
  web-base-url: ${APP_WEB_BASE_URL:https://plantahub.com.br}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://plantahub.com.br,https://www.plantahub.com.br}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

  admin:
    bootstrap-emails: ${APP_ADMIN_BOOTSTRAP_EMAILS:}

  s3:
    bucket: ${APP_S3_BUCKET}
    region: ${APP_S3_REGION}
    # Declaradas explicitamente: antes eram lidas por relaxed binding direto do ambiente,
    # sem aparecer em nenhum yml. Deixe vazias para usar a role da instancia.
    access-key: ${APP_S3_ACCESS_KEY:}
    secret-key: ${APP_S3_SECRET_KEY:}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}

  uploads:
    # Limite por arquivo. Projetos BIM passam facilmente de centenas de MB.
    max-size-bytes: ${APP_UPLOADS_MAX_SIZE_BYTES:2147483648}
    # Acima disto, multipart. Um PUT unico e irretomavel: numa conexao instavel,
    # perder 90% de um arquivo grande significa recomecar do zero.
    multipart-threshold-bytes: 104857600
    part-size-bytes: 16777216
    presign-ttl-seconds: 900
    multipart-presign-ttl-seconds: 3600
    allowed-extensions: pdf,dwg,dxf,rvt,ifc,skp,zip,rar,7z,xlsx,docx,png,jpg,jpeg,webp
    media-allowed-extensions: png,jpg,jpeg,webp,avif
    media-max-size-bytes: 10485760
    janitor:
      enabled: ${APP_UPLOADS_JANITOR_ENABLED:true}
      interval-ms: 3600000

  downloads:
    legacy-fallback: ${APP_DOWNLOADS_LEGACY_FALLBACK:true}

  # Ligado por padrao: sem SMTP ninguem recupera a senha. Desligar em prod descarta os
  # e-mails (o codigo nunca vai para o log).
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:PlantaHub <nao-responda@plantahub.com.br>}

  # Desligado => a tela nao oferece SMS.
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
      api-base-url: https://api.twilio.com

  password-reset:
    # Obrigatoria e sem default: com a chave de dev, os hashes do banco seriam quebraveis.
    secret: ${APP_PASSWORD_RESET_SECRET}
    email-code-ttl: 15m
    sms-code-ttl: 10m
    reset-token-ttl: 10m
    max-attempts: 5
    email-cooldown: 60s
    email-max-per-hour: 5
    ip-max-requests-per-hour: 20
    ip-max-verify-per-hour: 30

logging:
  level:
    org.hibernate.SQL: warn

infinitepay:
  handle: ${INFINITEPAY_HANDLE}
  redirect-url: ${INFINITEPAY_REDIRECT_URL}
  webhook-url: ${INFINITEPAY_WEBHOOK_URL}
  api-base-url: ${INFINITEPAY_API_BASE_URL:https://api.checkout.infinitepay.io}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
